components:
  securitySchemes:
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://localhost:8090/oauth2/authorize
          tokenUrl: https://localhost:8090/oauth2/token
          scopes:
            system: Access to system management APIs
        clientCredentials:
          tokenUrl: https://localhost:8090/oauth2/token
          scopes:
            system: Access to system management APIs

  parameters:
    ConnectionID:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid

    limitQueryParam:
      in: query
      name: limit
      required: false
      description: Maximum number of records to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30

    offsetQueryParam:
      in: query
      name: offset
      required: false
      description: Number of records to skip for pagination.
      schema:
        type: integer
        minimum: 0
        default: 0

  responses:
    InstanceList:
      description: Configured connection instances
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/ConnectionInstanceSummary'
    ConnectionUsages:
      description: Resources that reference this connection
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ConnectionUsagesResponse' }
          example:
            totalResults: 1
            count: 1
            summary:
              flow: 1
            usages:
              - resourceType: flow
                id: "f1b2c3d4-0000-0000-0000-000000000001"
                displayName: "Login Flow"
                behaviorOnDelete: restrict
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Connection not found
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: A connection with the same name already exists
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing or invalid authentication token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Insufficient permissions to perform this operation
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalServerError:
      description: Internal server error

  schemas:
    ConnectionListResponse:
      type: object
      required: [totalResults, startIndex, count, connections, links]
      properties:
        totalResults:
          type: integer
          description: Number of instances that match the listing operation.
          example: 3
        startIndex:
          type: integer
          description: Index of the first element of the page, which is equal to offset + 1.
          example: 1
        count:
          type: integer
          description: Number of elements in the returned page.
          example: 3
        connections:
          type: array
          items: { $ref: '#/components/schemas/ConnectionInstance' }
        links:
          type: array
          items: { $ref: '#/components/schemas/Link' }

    Link:
      type: object
      properties:
        href: { type: string, example: "/connections?offset=30&limit=30" }
        rel: { type: string, example: "next" }

    ConnectionInstance:
      type: object
      required: [id, name, type, categories]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "My Google" }
        description: { type: string }
        type:
          type: string
          description: >-
            Lowercase vendor identifier. `sms-gateway` denotes a generic HTTP webhook SMS sender.
          enum: [google, github, oidc, oauth, twilio, vonage, sms-gateway, email-smtp]
          example: "google"
        categories:
          type: array
          minItems: 1
          items:
            type: string
            enum: [identity-provider, sms-provider, email-provider]
          example: ["identity-provider"]

    ConnectionInstanceSummary:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "My Google" }
        description: { type: string }

    ConnectionUsage:
      type: object
      description: A single resource that references the connection.
      required:
        - resourceType
        - id
        - displayName
        - behaviorOnDelete
      properties:
        resourceType:
          type: string
          description: Type of the referencing resource.
          enum: [flow]
          example: flow
        id:
          type: string
          format: uuid
          description: Identifier of the referencing resource.
          example: "f1b2c3d4-0000-0000-0000-000000000001"
        displayName:
          type: string
          description: Human-readable name of the referencing resource.
          example: "Login Flow"
        behaviorOnDelete:
          type: string
          description: |
            What happens to this resource when the connection is deleted.
            - `fallback`: the reference is kept as-is.
            - `cascade`: the resource is permanently deleted.
            - `restrict`: the resource blocks deletion of the connection.
          enum: [fallback, cascade, restrict]
          example: restrict

    ConnectionUsagesSummary:
      type: object
      nullable: true
      description: |
        Per-resource-type count of usages, keyed by resource type
        (e.g. `flow`). Null when the counts could not be determined.
      additionalProperties:
        type: integer
      example:
        flow: 1

    ConnectionUsagesResponse:
      type: object
      description: |
        Resources that reference a connection, aggregated across all resource types.
        Drives pre-delete confirmation dialogs; informational only.
      properties:
        totalResults:
          type: integer
          nullable: true
          description: |
            Total number of resources that reference the connection.
            Null when usage data is unavailable; 0 means confirmed empty.
          example: 1
        count:
          type: integer
          description: Number of results returned.
          example: 1
        summary:
          $ref: '#/components/schemas/ConnectionUsagesSummary'
        usages:
          type: array
          items:
            $ref: '#/components/schemas/ConnectionUsage'

    GoogleConnectionUpdateRequest:
      type: object
      required: [name, clientId, redirectUri]
      properties:
        name: { type: string, example: "My Google" }
        description: { type: string }
        clientId: { type: string }
        clientSecret: { type: string, description: "Write-only. Omit to keep the stored value on update." }
        redirectUri: { type: string }
        scopes: { type: array, items: { type: string } }
        prompt: { type: string }
        jwksEndpoint: { type: string }
        issuer: { type: string }
        tokenExchangeEnabled: { type: boolean }
        attributeConfiguration: { $ref: '#/components/schemas/AttributeConfiguration' }
    GoogleConnectionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/GoogleConnectionUpdateRequest'
        - type: object
          required: [clientSecret]
    GoogleConnectionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        type: { type: string, example: "google" }
        clientId: { type: string }
        clientSecret: { type: string, description: "Masked as \"******\".", example: "******" }
        redirectUri: { type: string }
        scopes: { type: array, items: { type: string } }
        prompt: { type: string }
        jwksEndpoint: { type: string }
        issuer: { type: string }
        tokenExchangeEnabled: { type: boolean }
        attributeConfiguration: { $ref: '#/components/schemas/AttributeConfiguration' }

    GitHubConnectionUpdateRequest:
      type: object
      required: [name, clientId, redirectUri]
      properties:
        name: { type: string, example: "My GitHub" }
        description: { type: string }
        clientId: { type: string }
        clientSecret: { type: string, description: "Write-only. Omit to keep the stored value on update." }
        redirectUri: { type: string }
        scopes: { type: array, items: { type: string } }
        prompt: { type: string }
        attributeConfiguration: { $ref: '#/components/schemas/AttributeConfiguration' }
    GitHubConnectionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/GitHubConnectionUpdateRequest'
        - type: object
          required: [clientSecret]
    GitHubConnectionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        type: { type: string, example: "github" }
        clientId: { type: string }
        clientSecret: { type: string, example: "******" }
        redirectUri: { type: string }
        scopes: { type: array, items: { type: string } }
        prompt: { type: string }
        attributeConfiguration: { $ref: '#/components/schemas/AttributeConfiguration' }

    OIDCConnectionUpdateRequest:
      type: object
      required: [name, clientId, redirectUri, authorizationEndpoint, tokenEndpoint]
      properties:
        name: { type: string }
        description: { type: string }
        clientId: { type: string }
        clientSecret: { type: string, description: "Write-only. Omit to keep the stored value on update." }
        redirectUri: { type: string }
        authorizationEndpoint: { type: string }
        tokenEndpoint: { type: string }
        userInfoEndpoint: { type: string }
        jwksEndpoint: { type: string }
        issuer: { type: string }
        scopes: { type: array, items: { type: string } }
        prompt: { type: string }
        tokenExchangeEnabled: { type: boolean }
        idJagEnabled: { type: boolean, description: "Enable ID-JAG issuance for this identity provider (draft-ietf-oauth-identity-assertion-authz-grant), so that self-issued ID tokens naming it as issuer can be trusted for the jwt-bearer grant. Requires issuer and jwksEndpoint to be set." }
        trustedTokenAudience: { type: string }
        attributeConfiguration: { $ref: '#/components/schemas/AttributeConfiguration' }
    OIDCConnectionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/OIDCConnectionUpdateRequest'
        - type: object
          required: [clientSecret]
    OIDCConnectionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        type: { type: string, example: "oidc" }
        clientId: { type: string }
        clientSecret: { type: string, example: "******" }
        redirectUri: { type: string }
        authorizationEndpoint: { type: string }
        tokenEndpoint: { type: string }
        userInfoEndpoint: { type: string }
        jwksEndpoint: { type: string }
        issuer: { type: string }
        scopes: { type: array, items: { type: string } }
        prompt: { type: string }
        tokenExchangeEnabled: { type: boolean }
        idJagEnabled: { type: boolean, description: "Enable ID-JAG issuance for this identity provider (draft-ietf-oauth-identity-assertion-authz-grant), so that self-issued ID tokens naming it as issuer can be trusted for the jwt-bearer grant. Requires issuer and jwksEndpoint to be set." }
        trustedTokenAudience: { type: string }
        attributeConfiguration: { $ref: '#/components/schemas/AttributeConfiguration' }

    OAuthConnectionUpdateRequest:
      type: object
      description: |
        Generic OAuth 2.0 connection (no OpenID Connect discovery, no id_token). User attributes
        come from the provider's own profile API, given as userInfoEndpoint. That endpoint is
        provider-specific rather than an OpenID Connect UserInfo endpoint, and is optional: when it
        is omitted, the subject is read from the access token if the provider issues a JWT.
      required: [name, clientId, redirectUri, authorizationEndpoint, tokenEndpoint]
      properties:
        name: { type: string }
        description: { type: string }
        clientId: { type: string }
        clientSecret: { type: string, description: "Write-only. Omit to keep the stored value on update." }
        redirectUri: { type: string }
        authorizationEndpoint: { type: string }
        tokenEndpoint: { type: string }
        userInfoEndpoint: { type: string, description: "The provider's user profile API, called with the access token. Provider-specific, for example https://api.github.com/user. Omit it when the provider exposes no profile API and issues a JWT access token." }
        scopes: { type: array, items: { type: string } }
        prompt: { type: string }
        attributeConfiguration: { $ref: '#/components/schemas/AttributeConfiguration' }
    OAuthConnectionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/OAuthConnectionUpdateRequest'
        - type: object
          required: [clientSecret]
    OAuthConnectionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        type: { type: string, example: "oauth" }
        clientId: { type: string }
        clientSecret: { type: string, example: "******" }
        redirectUri: { type: string }
        authorizationEndpoint: { type: string }
        tokenEndpoint: { type: string }
        userInfoEndpoint: { type: string }
        scopes: { type: array, items: { type: string } }
        prompt: { type: string }
        attributeConfiguration: { $ref: '#/components/schemas/AttributeConfiguration' }

    TwilioConnectionUpdateRequest:
      type: object
      required: [name, accountSid, senderId]
      properties:
        name: { type: string, example: "My Twilio" }
        description: { type: string }
        accountSid: { type: string, description: "Twilio Account SID (AC followed by 32 hex characters).", example: "ACxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx" }
        authToken: { type: string, description: "Write-only. Omit to keep the stored value on update." }
        senderId: { type: string, description: "Sender phone number or alphanumeric sender ID.", example: "+15005550006" }
    TwilioConnectionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/TwilioConnectionUpdateRequest'
        - type: object
          required: [authToken]
    TwilioConnectionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        type: { type: string, example: "twilio" }
        accountSid: { type: string }
        authToken: { type: string, description: "Masked as \"******\".", example: "******" }
        senderId: { type: string }

    VonageConnectionUpdateRequest:
      type: object
      required: [name, apiKey, senderId]
      properties:
        name: { type: string, example: "My Vonage" }
        description: { type: string }
        apiKey: { type: string, description: "Vonage API key." }
        apiSecret: { type: string, description: "Write-only. Omit to keep the stored value on update." }
        senderId: { type: string, description: "Sender phone number or alphanumeric sender ID.", example: "ThunderID" }
    VonageConnectionCreateRequest:
      allOf:
        - $ref: '#/components/schemas/VonageConnectionUpdateRequest'
        - type: object
          required: [apiSecret]
    VonageConnectionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        type: { type: string, example: "vonage" }
        apiKey: { type: string }
        apiSecret: { type: string, description: "Masked as \"******\".", example: "******" }
        senderId: { type: string }

    SMSGatewayConnectionUpdateRequest:
      type: object
      required: [name, url]
      properties:
        name: { type: string, example: "Prod SMS Gateway" }
        description: { type: string }
        url: { type: string, description: "The HTTP endpoint to call to send an SMS.", example: "https://sms.example.com/send" }
        httpMethod: { type: string, enum: [GET, POST], example: "POST" }
        httpHeaders:
          type: string
          description: |
            Comma-separated `Key: value` pairs sent with every request, including any credential
            header the gateway requires. Header values are stored and returned in plain text.
          example: "Authorization: Bearer token"
        contentType: { type: string, enum: [JSON, FORM], example: "JSON" }
    SMSGatewayConnectionCreateRequest:
      $ref: '#/components/schemas/SMSGatewayConnectionUpdateRequest'
    SMSGatewayConnectionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        type: { type: string, example: "sms-gateway" }
        url: { type: string }
        httpMethod: { type: string }
        httpHeaders: { type: string }
        contentType: { type: string }

    SMTPConnectionUpdateRequest:
      type: object
      required: [name, host, port, fromAddress]
      properties:
        name: { type: string, example: "Corp SMTP" }
        description: { type: string }
        host: { type: string, description: "Hostname of the SMTP server.", example: "smtp.example.com" }
        port: { type: integer, minimum: 1, maximum: 65535, example: 587 }
        fromAddress: { type: string, format: email, description: "Address used in the From header and the SMTP envelope.", example: "noreply@example.com" }
        fromName:
          type: string
          description: |
            Display name shown beside `fromAddress` in the From header, so a recipient sees
            `Acme Support <noreply@example.com>`. Optional: without it the From header carries
            the bare address. It must not contain a line break. The SMTP envelope sender is
            always the bare `fromAddress`, whether or not a name is set.
          example: "Acme Support"
        tls:
          type: string
          enum: [none, starttls, implicit]
          default: starttls
          description: |
            How the connection to the SMTP server is secured. Defaults to `starttls` when
            omitted. `implicit` dials TLS directly (SMTPS, usually port 465). `none` sends in
            the clear and cannot carry credentials, so it cannot be combined with an
            `authentication` method other than `none`.
          example: "starttls"
        authentication:
          allOf:
            - $ref: '#/components/schemas/OutboundAuthentication'
          description: |
            How ThunderID authenticates to the SMTP server. Omit it to send no credentials.
            Call `GET /connections/meta?vendor=email-smtp` for the methods this deployment supports
            and the fields each one takes.
    SMTPConnectionCreateRequest:
      $ref: '#/components/schemas/SMTPConnectionUpdateRequest'
    SMTPConnectionResponse:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        type: { type: string, example: "email-smtp" }
        host: { type: string }
        port: { type: integer, example: 587 }
        fromAddress: { type: string, format: email }
        fromName: { type: string, example: "Acme Support" }
        tls: { type: string, enum: [none, starttls, implicit] }
        authentication: { $ref: '#/components/schemas/OutboundAuthentication' }

    OutboundAuthentication:
      type: object
      description: |
        How ThunderID authenticates itself on an outbound call. The `type` selects the method
        and `properties` carries that method's fields, so a new method needs no change to this
        schema. Call `GET /connections/meta?vendor={vendor}` to discover the methods a vendor
        supports and the fields each one takes.

        A field the method marks as a credential is write-only: it is stored encrypted, returned
        masked as `"******"`, and may be omitted on update to keep the stored value. Changing
        `type`, or setting it to `none`, discards the previous method's stored credentials.
      required: [type]
      properties:
        type:
          type: string
          description: "The authentication method. `none` sends no credentials."
          example: "basic"
        properties:
          type: object
          additionalProperties: { type: string }
          description: "The selected method's field values, keyed by field name."
          example:
            username: "mailer"
            password: "<smtp_password>"

    ConnectionMetaResponse:
      type: object
      description: "Server-driven description of a connection vendor's configurable options."
      properties:
        vendor: { type: string, example: "email-smtp" }
        authentication:
          type: object
          properties:
            methods:
              type: array
              description: |
                The outbound authentication methods this vendor supports, in the order a console
                should offer them. Empty when the vendor has no configurable choice, such as a
                provider whose credentials are a fixed vendor contract.
              items: { $ref: '#/components/schemas/OutboundAuthMethod' }

    OutboundAuthMethod:
      type: object
      properties:
        type: { type: string, example: "basic" }
        displayName:
          type: string
          description: "Label for the method. Either plain text or an i18n template pattern."
          example: "{{t(connections:outboundAuth.method.basic)}}"
        properties:
          type: array
          description: "The method's fields, in the order a console should render them."
          items: { $ref: '#/components/schemas/OutboundAuthField' }

    OutboundAuthField:
      type: object
      description: |
        One field of an authentication method, described with the same vocabulary as an entity
        type's property schema so a console can reuse its schema-driven form renderer.
      properties:
        name: { type: string, example: "password" }
        type: { type: string, enum: [string], example: "string" }
        required: { type: boolean, example: true }
        credential:
          type: boolean
          description: "A secret: stored encrypted, returned masked, omit on update to keep it."
          example: true
        enum:
          type: array
          items: { type: string }
          description: "When present, the value must be one of these choices."
        regex:
          type: string
          description: "When present, the pattern the value must match."
        displayName:
          type: string
          description: "Label for the field. Either plain text or an i18n template pattern."
          example: "{{t(connections:outboundAuth.field.password)}}"

    AttributeConfiguration:
      type: object
      description: External-to-local attribute mapping configuration for the connection.
      required:
        - userTypeResolution
      properties:
        userTypeResolution:
          $ref: '#/components/schemas/UserTypeResolution'
        userTypeAttributeMappings:
          type: array
          description: Per-user-type attribute mapping profiles.
          items:
            $ref: '#/components/schemas/UserTypeAttributeMapping'
        accountLinking:
          $ref: '#/components/schemas/AccountLinking'

    AccountLinking:
      type: object
      description: >
        Configures how an incoming federated identity is resolved to an existing local user when the
        subject identifier does not resolve one. All configured attributes that have a value are
        combined into a single lookup filter.
      properties:
        attributes:
          type: array
          description: External attribute names used together to resolve the local user.
          items:
            type: string
          example:
            - "email"

    UserTypeResolution:
      type: object
      description: Resolves which local user type an incoming federated identity maps to.
      required:
        - default
      properties:
        default:
          type: string
          description: >
            Fallback local user type, used when claim-driven resolution is not configured or the
            external attribute's value does not match a mapping.
          example: "Person"
        externalAttribute:
          type: string
          description: External claim whose value selects the local user type.
          example: "user_type"
        valueMapping:
          type: object
          description: Maps an external attribute value to a local user type.
          additionalProperties:
            type: string
          example:
            staff: "Employee"

    UserTypeAttributeMapping:
      type: object
      required:
        - userType
      description: Attribute mapping profile for a single local user type.
      properties:
        userType:
          type: string
          description: Local user type this profile applies to.
          example: "Person"
        attributes:
          type: array
          description: External-to-local attribute mappings for this user type.
          items:
            $ref: '#/components/schemas/AttributeMapping'

    AttributeMapping:
      type: object
      required:
        - externalAttribute
        - localAttribute
      description: Maps a single external IDP attribute to a local user attribute.
      properties:
        externalAttribute:
          type: string
          description: >
            External claim name emitted by the IDP. May be a dot-notation path into a nested
            claim (e.g. "address.email"). A literal name containing dots is matched first.
          example: "given_name"
        localAttribute:
          type: string
          description: Target local attribute name. Must exist in the user type's schema.
          example: "firstName"

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "IDP-1001"
        message:
          $ref: '#/components/schemas/I18nMessage'
        description:
          $ref: '#/components/schemas/I18nMessage'

    I18nMessage:
      type: object
      required: [key, defaultValue]
      properties:
        key: { type: string }
        defaultValue: { type: string }
